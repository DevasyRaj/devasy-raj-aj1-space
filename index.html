<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devasy Raj | Space Exploration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050816;
            color: white;
            line-height: 1.6;
        }

        header {
            background: #0b1026;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            color: #8ab4ff;
            margin-bottom: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #8ab4ff;
        }

        section {
            padding: 70px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #050816, #111d45);
        }

        .hero h2 {
            font-size: 48px;
            color: #8ab4ff;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            max-width: 650px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #3867d6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        h2 {
            color: #8ab4ff;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #10172f;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #27345f;
        }

        .card h3 {
            color: #8ab4ff;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #0b1026;
            color: #aaa;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 36px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Devasy Raj</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#planets">Planets</a>
        <a href="#missions">Missions</a>
        <a href="#contact">Contact</a>
    </nav>
</header>
